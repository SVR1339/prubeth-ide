<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgObsidian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    
    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Neon Magenta/Purple Gradient -->
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Pure Pearl White Blade Gradient -->
    <linearGradient id="whiteBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Glossy Jet Black Blade Gradient -->
    <linearGradient id="blackBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgObsidian)"/>

  <!-- Tower Base (Minimalist Geometric Architectural Pedestal) -->
  <path d="M 232,270 L 220,350 L 292,350 L 280,270 Z" fill="url(#blackBlade)" stroke="url(#cyanAccent)" stroke-width="2"/>

  <!-- Central Windmill Rotor Group -->
  <g transform="translate(256, 230)">
    <!-- Top-Left Sail (Crisp Pearl White with Cyan Highlight) -->
    <path d="M 0,-15 L -90,-120 L -30,-135 L -8,-25 Z" fill="url(#whiteBlade)" stroke="url(#cyanAccent)" stroke-width="3"/>

    <!-- Top-Right Sail (Glossy Jet Black with Neon Violet Contour) -->
    <path d="M 15,0 L 120,-90 L 135,-30 L 25,-8 Z" fill="url(#blackBlade)" stroke="url(#purpleAccent)" stroke-width="3"/>

    <!-- Bottom-Right Sail (Crisp Pearl White with Violet Highlight) -->
    <path d="M 0,15 L 90,120 L 30,135 L 8,25 Z" fill="url(#whiteBlade)" stroke="url(#purpleAccent)" stroke-width="3"/>

    <!-- Bottom-Left Sail (Glossy Jet Black with Cyan Contour) -->
    <path d="M -15,0 L -120,90 L -135,30 L -25,8 Z" fill="url(#blackBlade)" stroke="url(#cyanAccent)" stroke-width="3"/>

    <!-- Inner Core & Center Pivot -->
    <circle cx="0" cy="0" r="24" fill="#04060A" stroke="url(#cyanAccent)" stroke-width="4"/>
    <circle cx="0" cy="0" r="10" fill="url(#purpleAccent)"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="420" font-family="'Segoe UI', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="10">PRUBETH</text>
  <text x="256" y="452" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="url(#cyanAccent)" text-anchor="middle" letter-spacing="5">THE AI POWERED IDE</text>
</svg>