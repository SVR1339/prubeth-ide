<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Drop Shadow for Bloom Depth -->
    <filter id="bloomShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#bloomShadow)" transform="translate(256, 256)">
    <!-- Diagonal Peach Petals (Translucent Overlay) -->
    <g fill="#F7A07E" opacity="0.9">
      <ellipse cx="0" cy="-115" rx="42" ry="84" transform="rotate(45)"/>
      <ellipse cx="0" cy="-115" rx="42" ry="84" transform="rotate(135)"/>
      <ellipse cx="0" cy="-115" rx="42" ry="84" transform="rotate(225)"/>
      <ellipse cx="0" cy="-115" rx="42" ry="84" transform="rotate(315)"/>
    </g>

    <!-- Cardinal Violet/Purple Petals -->
    <g fill="#7059E2" opacity="0.95">
      <ellipse cx="0" cy="-115" rx="46" ry="88" transform="rotate(0)"/>
      <ellipse cx="0" cy="-115" rx="46" ry="88" transform="rotate(90)"/>
      <ellipse cx="0" cy="-115" rx="46" ry="88" transform="rotate(180)"/>
      <ellipse cx="0" cy="-115" rx="46" ry="88" transform="rotate(270)"/>
    </g>

    <!-- Center Mint Turquoise Disc -->
    <circle cx="0" cy="0" r="44" fill="#4ECDC4" stroke="#FFFFFF" stroke-width="2" opacity="0.95"/>
  </g>
</svg>